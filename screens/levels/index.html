<head>
    <link rel="stylesheet" href="../style.css">
</head>

<body>
    <div id="background" class="playBg"></div>
    <p id="game-title">level select</p>

    <div id="options">
        <div class="option" id="return" style="position: absolute; top: 40px;" onclick='window.location.href = "../start"' enabled white>go back</div>
    </div>
    <div id="levels">

    </div>

    <script src="../../script/tools.js"></script>

        <p id="credits">&#169 2026 - Axolay</p>
    <script>
        const audio = window.parent.audio
        const parent = window.parent

        parent.document.title = "settings - evil cat game"

        const buttons = document.querySelectorAll('.button')
        buttons.forEach((element, i) => {
            if(element.hasAttribute("enabled")) {
            element.addEventListener('pointerdown', () => {
                audio.click0.play()
                audio.click1.pause()
                audio.click1.currentTime = 0
            })
            element.addEventListener('pointerup', () => {
                audio.click0.pause()
                audio.click1.play()
                audio.click0.currentTime = 0
            })
            element.addEventListener('click', () => {
                buttonClick(i)
            })
        }
        });

        function buttonClick(id) {
            switch (id) {
                case 0:
                    window.location.href = "settings.html?page=gameplay"
                    break;
                case 1:
                    window.location.href = "settings.html?page=performance"
                    break;
                case 2:
                    window.location.href = "../start"
                default:
                    break;
            }
        }

        function loadLevels() {
            for(let i = 0; i < 1; i++) {
                const level = document.createElement("div")
                level.className = "level"
                level.textContent = i + 1
                element("levels").appendChild(level)
            }
        }

        element("levels").addEventListener('click', (e) => {
            audio.intro.pause()
            parent.game.start()
        })

        loadLevels()

        if(!parent.config.performance.background) {
            document.querySelector("#background").id = "noBg"
        }

    </script>
</body>
