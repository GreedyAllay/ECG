<head>
    <link rel="stylesheet" href="style.css">
</head>


<body>
    <div id="startAudio">
        
        <p>press anything to enable audio</p>
    </div>
    <p id="game-title">evil cat game</p>


    <div id="buttons">
        <div class="button" enabled>play</div>
        <div class="button">settings</div>
        <div class="button">multiplayer</div>
        <div class="button">level editor</div>
        <div class="button" enabled>credits</div>
    </div>

    <div id="notice">Please set scroll to 80% or it breaks sorry</div>

    <script src="../script/game/audio.js"></script>
    <script src="../script/tools.js"></script>

        <p id="credits">&#169 2026 - Axolay | pre-alpha v0.1</p>
    <script>
        window.startGame = false
        const buttons = document.querySelectorAll('.button')
        buttons.forEach((element, i) => {
            if(element.hasAttribute("enabled")) {
            element.addEventListener('pointerdown', () => {
                sounds.click0.play()
                sounds.click1.pause()
                sounds.click1.currentTime = 0
            })
            element.addEventListener('pointerup', () => {
                sounds.click0.pause()
                sounds.click1.play()
                sounds.click0.currentTime = 0
            })
            element.addEventListener('click', () => {
                buttonClick(i)
            })
        }
        });

        const startAudio = element("startAudio")
        startAudio.addEventListener('click', () => {
            startAudio.remove()
        })
        addEventListener('keydown', () => {
            startAudio.remove()
        })
        function buttonClick(id) {
            switch (id) {
                case 0:
                    sounds.song.pause()
                    window.parent.game.start()
                    break;
                case 5:
                    window.location.href = "credits.html"
                default:
                    break;
            }
        }

        let songStarted = false

        addEventListener('click', () => {
            if(!songStarted) {
                songStarted = true
                sounds.song.play()
            }

        })
    </script>

    <style>
        html, body {
            background-color: #313148;
            font-family: Archivo;
            user-select: none;
            zoom: 2;
        }

        #game-title {
            color: white;
            font-family: Archivo;
            text-align: right;
            margin-top: 20px;
            margin-right: 20px;
            font-size: 25;
        }

        .button[enabled] {
            color: #ffa800;
            cursor: pointer;
        }

        .button {
            color: gray;
            padding: 10px;
            font-size: 15;
            margin-top: -15;
        }

        #buttons {
            width: 100px;
            text-align: right;
            margin-left: auto;
            margin-right: 20px;
            margin-top: 50px;
        }

        .button:active[enabled] {
            filter: brightness(.8);
        }

        #credits {
            font-size: 5px;
            color: white;
            padding-top: auto;
            position: absolute;
        }

        #notice {
            background-color: rgb(112, 59, 59);
            border-color: rgb(147, 45, 45);
            border-width: .5px;
            border-style: solid;
            color: white;
            padding-left: 20px;
            padding-right: 20px;
            padding-top: 5px;
            padding-bottom: 5px;
            margin-top: 5px;
            border-radius: 3px;
            position: fixed;
            top: 0;
            margin-left: auto;
            margin-right: auto;
            font-size: 5px;
            left: 50%;
            transform: translateX(-50%);
        }

        @font-face {
            font-family: Archivo;
            src: url('../assets/fonts/archivo.ttf');
        }

        #startAudio {
            background-color: rgba(128, 128, 128, 0.272);
            background-color: #313148;
            position: fixed;
            left: 0;
            top:0;
            z-index: 9999;
            width: 100%;
            height: 100%;
            text-align: center;
            cursor: pointer;
            color: white;
        }

        #startAudio.p {
            left: 50%;
            top: 50%;
            transform: translateX(50%);
            transform: translateY(-50%);
        }


    </style>
</body>
