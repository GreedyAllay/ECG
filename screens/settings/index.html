<head>
    <link rel="stylesheet" href="../style.css">
</head>

<body>
    <div id="background" class="gearBg"></div>
    <p id="game-title">settings</p>


    <div id="buttons">
        <div class="button" enabled>gameplay</div>
        <div class="button" enabled>performance</div>
        <div class="button"  white enabled >go back</div>
    </div>

    <script src="../../script/tools.js"></script>

        <p id="credits">&#169 2026 - Axolay</p>
    <script>
        const audio = window.parent.audio
        const parent = window.parent

        parent.document.title = "settings - evil cat game"

        const buttons = document.querySelectorAll('.button')
        buttons.forEach((element, i) => {
            if(element.hasAttribute("enabled")) {
            element.addEventListener('pointerdown', () => {
                audio.click0.play()
                audio.click1.pause()
                audio.click1.currentTime = 0
            })
            element.addEventListener('pointerup', () => {
                audio.click0.pause()
                audio.click1.play()
                audio.click0.currentTime = 0
            })
            element.addEventListener('click', () => {
                buttonClick(i, element)
            })
        }
        });

        function buttonClick(id, el) {
            if(el.hasAttribute("enabled")) {
                el.removeAttribute("enabled")
                el.textContent += "..."
            }
            switch (id) {
                case 0:
                    window.location.href = "settings.html?page=gameplay"
                    break;
                case 1:
                    window.location.href = "settings.html?page=performance"
                    break;
                case 2:
                    window.location.href = "../start"
                default:
                    break;
            }
        }

        function updatePage() {
            location.reload
        }

        function animateTransition() {
            const transition = document.createElement("img")
            transition.id="transition"
            document.appendChild(transition)
        }

        if(!parent.config.performance.background) {
            document.querySelector("#background").id = "noBg"
        }

    </script>
</body>
