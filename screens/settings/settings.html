<head>
    <link rel="stylesheet" href="../style.css">
</head>

<body>
    <div id="background" class="settingBg"></div>
    <p id="game-title">gameplay</p>


    <div id="options">
        <div class="option" id="return" enabled white>go back</div>
    </div>

    <script src="../../script/tools.js"></script>

        <p id="credits">&#169 2026 - Axolay</p>
    <script>
        const parent = window.parent
        const buttons = document.querySelectorAll('.option')
        const audio = window.parent.audio

        parent.document.title = "gameplay - evil cat game"

        const parameters = new URLSearchParams(window.location.search);
        const page = parameters.get('page')

        function generateOptions() {
            const options = Object.keys(parent.config[page])
            options.forEach(option => {
                let thisOption = parent.config[page][option]
                const optionObject = document.createElement("div")
                optionObject.className = "option"

                function setThisThing() {
                    optionObject.textContent = `${option}: ${thisOption ? "on" : "off"}`
                    optionObject.setAttribute("on", thisOption)
                }

                setThisThing()
                element("options").prepend(optionObject)
                optionObject.addEventListener("click", () => {
                    thisOption = !thisOption
                    parent.config[page][option] = thisOption
                    setThisThing()
                })
            });
        }

        generateOptions()

        buttons.forEach((element, i) => {
            if(element.hasAttribute("enabled")) {
            element.addEventListener('pointerdown', () => {
                audio.click0.play()
                audio.click1.pause()
                audio.click1.currentTime = 0
            })
            element.addEventListener('pointerup', () => {
                audio.click0.pause()
                audio.click1.play()
                audio.click0.currentTime = 0
            })
        }
        });

        element("return").addEventListener("click", () => {
            window.location.href = "index.html"
        })

        if(!parent.config.performance.background) {
            document.querySelector("#background").id = "noBg"
        }

    </script>
</body>
