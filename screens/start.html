<head>
    <link rel="stylesheet" href="style.css">
</head>


<body>
    <div id="startAudio">
        
        <p>press anything to enable audio</p>
    </div>
    <p id="game-title">evil cat game</p>


    <div id="buttons">
        <div class="button" enabled>play</div>
        <div class="button">settings</div>
        <div class="button">multiplayer</div>
        <div class="button">level editor</div>
        <div class="button" enabled>credits</div>
    </div>

    <div id="notice">Please set scroll to 80% or it breaks sorry</div>

    <script src="../script/game/audio.js"></script>
    <script src="../script/tools.js"></script>

        <p id="credits">&#169 2026 - Axolay | pre-alpha v0.1</p>
    <script>
        window.startGame = false
        const buttons = document.querySelectorAll('.button')
        buttons.forEach((element, i) => {
            if(element.hasAttribute("enabled")) {
            element.addEventListener('pointerdown', () => {
                sounds.click0.play()
                sounds.click1.pause()
                sounds.click1.currentTime = 0
            })
            element.addEventListener('pointerup', () => {
                sounds.click0.pause()
                sounds.click1.play()
                sounds.click0.currentTime = 0
            })
            element.addEventListener('click', () => {
                buttonClick(i)
            })
        }
        });

        const startAudio = element("startAudio")
        startAudio.addEventListener('click', () => {
            startAudio.remove()
        })
        addEventListener('keydown', () => {
            startAudio.remove()
        })
        function buttonClick(id) {
            switch (id) {
                case 0:
                    sounds.song.pause()
                    window.parent.game.start()
                    break;
                case 5:
                    window.location.href = "credits.html"
                default:
                    break;
            }
        }

        let songStarted = false

        addEventListener('click', () => {
            if(!songStarted) {
                songStarted = true
                sounds.song.play()
            }

        })
    </script>


</body>
