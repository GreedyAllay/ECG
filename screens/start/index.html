<head>
    <link rel="stylesheet" href="../style.css">
</head>


<body>
    <div id="startAudio">
        <p>press anything to enable audio</p>
    </div>
    <p id="game-title">evil cat game</p>


    <div id="buttons">
        <div class="button" enabled tabindex="0">play</div>
        <div class="button" enabled tabindex="1">settings</div>
        <div class="button">multiplayer</div>
        <div class="button">level editor</div>
        <div class="button" enabled tabindex="3">credits</div>
    </div>

    <div id="notice" hidden>Please use a chromium-based browser for best performance <a href="firefox.html">more info</a></div>

    <script src="../../script/tools.js"></script>

        <p id="credits">&#169 2026 - Axolay | pre-alpha v0.1</p>
    <script>
        const audio = window.parent.audio
        const buttons = document.querySelectorAll('.button')

        parent.document.title = "evil cat game by Axolay"

        buttons.forEach((element, i) => {
            if(element.hasAttribute("enabled")) {
            element.addEventListener('pointerdown', () => {
                    startClickSound()
            })
            element.addEventListener('pointerup', () => {
                if(i == 0) {
                    audio.coolclick.play()
                } else {
                    stopClickSound()

                }
            })
            element.addEventListener('click', () => {
                buttonClick(i)
            })
        }
        });

        function startClickSound() {
            audio.click0.play()
            audio.click1.pause()
            audio.click1.currentTime = 0
        }
        function stopClickSound() {
            audio.click0.pause()
            audio.click1.play()
            audio.click0.currentTime = 0
        }

        const startAudio = element("startAudio")
        startAudio.addEventListener('click', () => {
            startScreen()
        })

        if(sessionStorage.getItem("allowedAudio")) {
            //startScreen()
        }

        function buttonClick(id) {
            switch (id) {
                case 0:
                    audio.song.pause()
                    window.parent.game.start()
                    break;
                case 1:
                    window.location.href = "../settings"
                    break;
                case 4:
                    window.location.href = "../credits"
                default:
                    break;
            }
        }

        let songStarted = false

        addEventListener('click', () => {
            startScreen()
        })

        function startScreen() {
            sessionStorage.setItem("allowedAudio", true)
            startAudio.remove()
          if(!songStarted) {
                songStarted = true
                audio.song.play()
            }
        }

        if(navigator.userAgent.includes("Firefox")) {
            element("notice").removeAttribute("hidden")
        }
    </script>
</body>
