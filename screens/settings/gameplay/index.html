<head>
    <link rel="stylesheet" href="../../style.css">
</head>

<body>
    <p id="game-title">settings</p>


    <div id="buttons">
        <div class="button" enabled>shaders: off</div>
        <div class="button" enabled>particles: off</div>
        <div class="button" enabled white>go back</div>
    </div>

    <script src="../../script/tools.js"></script>

        <p id="credits">&#169 2026 - Axolay | pre-alpha v0.1</p>
    <script>
        const parent = window.parent
        const buttons = document.querySelectorAll('.button')
        buttons.forEach((element, i) => {
            if(element.hasAttribute("enabled")) {
            element.addEventListener('pointerdown', () => {
                audio.click0.play()
                audio.click1.pause()
                audio.click1.currentTime = 0
            })
            element.addEventListener('pointerup', () => {
                audio.click0.pause()
                audio.click1.play()
                audio.click0.currentTime = 0
            })
            element.addEventListener('click', () => {
                buttonClick(i)
            })
        }
        });

        addEventListener("keydown", () => {
            audio.music.pause()
        }) 

        function buttonClick(id) {
            switch (id) {
                case 0:
                    //window.parent.sounds.song.pause()
                    window.parent.game.start()
                    break;
                case 1:
                    window.location.href = ""
                    break;
                case 4:
                    window.location.href = "../"
                default:
                    break;
            }
        }
    </script>
</body>
