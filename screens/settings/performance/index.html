    <script>
        const parent = window.parent
        const buttons = document.querySelectorAll('.option')
        const audio = window.parent.audio

        parent.document.title = "gameplay - evil cat game"

        function generateOptions(path) {
            const options = Object.keys(parent.config.performance)
            options.forEach(option => {
                const optionObject = document.createElement("div")
                optionObject.className = "option"
                optionObject.textContent = option
                element("options").prepend(optionObject)
                optionObject.addEventListener("click", () => {
                })
            });
        }

        generateOptions("performance")

        buttons.forEach((element, i) => {
            if(element.hasAttribute("enabled")) {
            element.addEventListener('pointerdown', () => {
                audio.click0.play()
                audio.click1.pause()
                audio.click1.currentTime = 0
            })
            element.addEventListener('pointerup', () => {
                audio.click0.pause()
                audio.click1.play()
                audio.click0.currentTime = 0
            })
        }
        });

        element("return").addEventListener("click", () => {
            window.location.href = "../"
        })

    </script>
